; PHP-FPM Pool Terisolasi khusus Ruang360° (360.galipatsistem.com)
; Tidak mengubah www.conf maupun konfigurasi php.ini proyek lain di VPS!

[ruang360]
user = __WEB_USER__
group = __WEB_GROUP__

listen = __PHP_FPM_SOCK__
listen.owner = __WEB_USER__
listen.group = __WEB_GROUP__
listen.mode = 0660

; Mode ondemand: hemat RAM saat idle agar tidak membebani proyek lain di VPS
pm = ondemand
pm.max_children = 10
pm.process_idle_timeout = 30s
pm.max_requests = 250

; Limit khusus pemrosesan panorama 4K & OpenCV 28-frame
php_admin_value[memory_limit] = 1024M
php_admin_value[upload_max_filesize] = 50M
php_admin_value[post_max_size] = 120M
php_admin_value[max_file_uploads] = 40
php_admin_value[max_execution_time] = 180
php_admin_value[max_input_time] = 180
