# Nginx Virtual Host KHUSUS Ruang360° (360.galipatsistem.com)
# Mode Cloudflare SSL: Flexible (Cloudflare Terminate HTTPS -> Origin HTTP :80)
# PENTING: Jangan redirect 301 ke https:// di blok ini agar tidak ERR_TOO_MANY_REDIRECTS!

server {
    listen 80;
    listen [::]:80;
    server_name 360.galipatsistem.com;

    root __APP_DIR__/public;
    index index.php index.html;

    charset utf-8;

    # Izinkan upload 28+ frame HD OpenCV 4K & file 360° panorama besar
    client_max_body_size 150M;
    client_body_timeout 180s;

    access_log /var/log/nginx/360.galipatsistem.com-access.log;
    error_log  /var/log/nginx/360.galipatsistem.com-error.log;

    # Security headers aman untuk WebGL/Three.js & iframe sameorigin
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Cache agresif untuk panorama WebP/JPG, thumbnail, CSS, JS, dan APK
    location ~* \.(?:webp|jpe?g|png|gif|ico|css|js|woff2?|svg|wav|mp3)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;

        # Timeout panjang untuk penjahitan OpenCV 4K & pemrosesan panorama Imagick
        fastcgi_read_timeout 180s;
        fastcgi_send_timeout 180s;

        # Menggunakan PHP-FPM pool terisolasi khusus Ruang360° (aman untuk VPS multi-proyek)
        fastcgi_pass unix:__PHP_FPM_SOCK__;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
